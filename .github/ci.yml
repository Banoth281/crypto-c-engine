name: C/C++ Modular Cryptography CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Compile Application
      run: |
        mkdir -p bin
        gcc -I. -Iinclude src/crypto.c src/main.c -o bin/crypto_engine

    - name: Run Test Suite
      run: ./bin/crypto_engine test
